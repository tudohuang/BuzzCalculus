# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate problem bank
        run: |
          node tools/validate_problems.js
          node tools/validate_training_packs.js
          node tools/validate_path_nodes.js
          node tools/validate_answer_checker.js
          node tools/validate_calculus_only.js
          node tools/validate_records_v2.js
          node tools/validate_skill_graph.js
          node tools/validate_ability_model.js
          node tools/validate_planner.js
          node tools/validate_analytics.js
          node tools/validate_offline_assets.js
          node tools/validate_app_shell.js
          node tools/validate_version.js
          node tools/spec_snapshot.js
          node tools/validate_content_metadata.js
          node tools/validate_privacy.js
          node tools/validate_derived_hints.js
          node tools/validate_graph_choices.js
          node tools/validate_worksheets.js
          node tools/validate_katex.js
          node tools/validate_public_claims.js
          node tools/validate_hints.js
          node tools/validate_golden.js
          node tools/smoke_app_render.js
          node tools/verify_proof_claims.js
      - name: E2E main flow
        # 真的開一顆 Chrome、走完「開局 → 答題 → 結算 → 錯題進本」。
        # 這一步測的是其他驗證器看不到的那一層：東西有沒有**顯示出來**、
        # 點下去有沒有反應。實測抓到過結算頁全白（DOM 有兩萬字、畫面零字）
        # 與第一畫面題數寫死。約 45 秒。
        run: node tools/e2e_main_flow.js
      - name: E2E handwriting
        # 手寫計算紙的失敗方式全是行為層的，字串比對一條都抓不到：
        # 手掌畫出線、長按跳選單、橡皮擦把方格一起蓋掉、復原時整頁重繪。
        # 這一步用合成的 PointerEvent 畫，然後去數畫布的像素。
        run: node tools/e2e_handwriting.js
      - name: E2E mobile layout
        # README 第一句賣點是「手機優先的選擇題練習」，但其他 E2E 全跑在 1280 寬。
        # 窄畫面壞掉的方式是「看得到但測不到」：DOM 完整、文字都在、console 乾淨，
        # 只是有東西在畫面外，或按鈕小到手指按不準。
        # 這一步用 CDP 開一個真的 390×844 視窗，量橫向溢出與觸控目標大小。
        run: node tools/e2e_mobile.js
      - name: Verify answers independently
        # 這一步是題庫的品質底線：從題幹推出一條與解題無關的數值路徑，
        # 再跟答案比對。不符必須是零 —— spec 00 說得很直白，
        # 「答案錯一題造成的信任損失，大於新增五十題的收益」。
        run: |
          node tools/expand_templates.js --check
          node tools/detect_duplicates.js --ci
          node tools/verify_answers.js --ci
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-stable-v1
      - name: Machine-verify Lean proofs
        # Reference solutions in src/proofs.js (lean tier) must compile,
        # or the deploy is blocked.
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain stable
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          node tools/verify_lean_proofs.js
      - name: Assemble site
        # Deploy only the app shell — keep reports, tools, LaTeX sources,
        # and the workbook PDF (future paid product) off the public site.
        run: |
          mkdir -p _site
          cp index.html workbook.html styles.css sw.js manifest.webmanifest _site/
          cp privacy.html terms.html about.html changelog.html _site/
          cp -r assets src demo _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
