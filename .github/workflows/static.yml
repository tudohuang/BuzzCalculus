# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # E2E 的固定等待乘 3：runner 比開發機慢好幾倍，sleep(600) 在這裡等不到 render。
      # 見 tools/lib/cdp.js；本機用 BUZZ_E2E_CPU_THROTTLE=6 可以重現 runner 的節奏。
      BUZZ_E2E_SLOW: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Type check (JSDoc + tsc --noEmit, zero build)
        # 程式碼是 .js、沒有編譯；型別在 types/buzz.d.ts 與各檔的 JSDoc，
        # 這一步只檢查不產出。TypeScript 只在 CI 與開發機用，不進 runtime。
        run: npm run typecheck
      - name: Validate problem bank
        # tools/ci_checks.js 逐支跑，紅的那支會變成 annotation（job log 要認證才看得到）。
        # 本機一樣可以：node tools/ci_checks.js validate_course.js validate_katex.js
        run: >
          node tools/ci_checks.js
          "regen_all.js --check"
          validate_problems.js validate_daily_one.js validate_training_packs.js validate_path_nodes.js
          validate_answer_checker.js validate_calculus_only.js validate_records_v2.js validate_skill_graph.js
          validate_ability_model.js validate_planner.js validate_analytics.js validate_offline_assets.js
          validate_app_shell.js validate_version.js spec_snapshot.js validate_content_metadata.js
          validate_privacy.js validate_derived_hints.js validate_graph_choices.js validate_worksheets.js
          validate_katex.js validate_public_claims.js validate_hints.js validate_performance_budget.js
          validate_proof_lang.js validate_proof_surface.js validate_course.js validate_golden.js validate_verify_paths.js validate_epsilon_game.js validate_solution_steps.js validate_i18n.js smoke_app_render.js verify_proof_claims.js validate_course_v2.js
      - name: E2E main flow
        # 真的開一顆 Chrome、走完「開局 → 答題 → 結算 → 錯題進本」。
        # 這一步測的是其他驗證器看不到的那一層：東西有沒有**顯示出來**、
        # 點下去有沒有反應。實測抓到過結算頁全白（DOM 有兩萬字、畫面零字）
        # 與第一畫面題數寫死。約 45 秒。
        run: node tools/e2e_main_flow.js
      - name: E2E storage failure recovery
        run: node tools/e2e_storage.js
      - name: E2E handwriting
        # 手寫計算紙的失敗方式全是行為層的，字串比對一條都抓不到：
        # 手掌畫出線、長按跳選單、橡皮擦把方格一起蓋掉、復原時整頁重繪。
        # 這一步用合成的 PointerEvent 畫，然後去數畫布的像素。
        run: node tools/e2e_handwriting.js
      - name: E2E mobile layout
        # README 第一句賣點是「手機優先的選擇題練習」，但其他 E2E 全跑在 1280 寬。
        # 窄畫面壞掉的方式是「看得到但測不到」：DOM 完整、文字都在、console 乾淨，
        # 只是有東西在畫面外，或按鈕小到手指按不準。
        # 這一步用 CDP 開一個真的 390×844 視窗，量橫向溢出與觸控目標大小。
        run: node tools/e2e_mobile.js
      - name: E2E layout
        # 外殼的幾何不變量：分頁列貼底、側欄靠左、內容不被蓋、無橫向溢出。
        run: node tools/e2e_layout.js
      - name: E2E responsive workspace
        run: node tools/e2e_responsive_workspace.js
      - name: E2E proof language
        # 白話證明：教學→練習→題目，打字即時三色、錯的 δ 紅在第 4 行、草稿存活
        run: node tools/e2e_proof_lang.js
      - name: E2E beginner journey
        # 用高中先修的眼睛走一次：定位從 R1 起、有「還沒學過」、頭幾局不倒數、
        # 選項沒有外星人、做兩題離開不會被記 0/13。
        run: node tools/e2e_beginner.js
      - name: E2E course (v2, phone)
        # 新版課程在手機寬度走一次：首屏不抓課程檔、課程表只開目前的 Stage、範例一步一步揭、
        # 證明預設收起點了才開、小測選錯理由才出現且沒被浮層蓋住、推薦題開一局回得來；英文介面仍是舊課、沒有中文。
        run: node tools/e2e_course_v2.js
      - name: E2E course map
        # 課程地圖（清單／地圖切換）：切到地圖才抓那兩支檔、拉遠 13 個 Stage、捏合／滾輪／點兩下縮放、
        # 點一課亮起整串先修（數量跟 DAG 一樣）、「開始這課」「在地圖上看」、方向鍵與 Enter、深色、reduced-motion，
        # 外加拖 60 格量 rAF 間隔與地圖自己每格的繪製時間（canvas 上的東西字串比對測不到）。
        run: node tools/e2e_course_map.js
      - name: E2E course video
        # 課程影片：有影片的課先只有預覽圖（loading=lazy）、點了才建 <video>、點之前沒有 mp4 請求；
        # 片源跟主題與寬度走、整頁重繪後同一支影片接著播、Service Worker 不攔 /media/、Cache Storage 沒有影片、載不到只留一行說明。
        # 影片不在 git：先照 media/manifest.json 從 Release 抓下來（逐檔驗 sha256），跟 Vercel 部署時同一支工具。
        run: |
          node tools/fetch_media.js
          node tools/e2e_course_video.js
      - name: E2E course sections
        # 分節模式（一節一屏）：預設分節、點一下出下一句（按鈕／點句子／→）、句子帶 fig 時 widget 真的動（reduced-motion 直接跳）、
        # 結尾的小測當下對錯、拖滑桿進範圍、一節 +5 XP 只發一次、記到節、結算列出學習目標與 XP、在地圖上看那一課亮一下、
        # 每日任務「讀一節課」與連勝、「全文」切回整頁而且記住、手機圖黏在頂列下、390 寬不溢出。影片那一節用上一步抓好的 media/。
        run: node tools/e2e_course_sections.js
      - name: E2E interactive graphs
        # 點位題與切線題的作答動作發生在 SVG 上，字串比對測不到：
        # 事件沒綁、座標換算 y 軸沒翻、touch-action 沒設（手機上一拖變捲頁）
        # 三種壞法在 DOM 裡看起來都完全正常。這一步派真的 pointer 事件進去。
        run: node tools/e2e_graph_interactive.js
      - name: E2E English interface
        # lang=en 之後每一頁看得見的字都不能是中文、題幹要換成英文側表、設定頁切回中文要 reload 回來。
        # validate_i18n 在原始碼層擋漏包的字串；這一步抓的是「字典有、但 render 走了別條路」。
        run: node tools/e2e_i18n.js
      - name: Verify answers independently
        # 這一步是題庫的品質底線：從題幹推出一條與解題無關的數值路徑，
        # 再跟答案比對。不符必須是零 —— spec 00 說得很直白，
        # 「答案錯一題造成的信任損失，大於新增五十題的收益」。
        run: |
          node tools/expand_templates.js --check
          node tools/detect_duplicates.js --ci
          node tools/verify_answers.js --ci
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-stable-v1
      - name: Machine-verify Lean proofs
        # Reference solutions in src/proofs.js (lean tier) must compile,
        # or the deploy is blocked.
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain stable
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          node tools/verify_lean_proofs.js
      - name: Assemble site
        # Deploy only the app shell — keep reports, tools and LaTeX sources off the public site.
        run: |
          mkdir -p _site
          cp index.html styles.css sw.js manifest.webmanifest _site/
          cp privacy.html terms.html about.html guide.html _site/
          cp -r assets src _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
