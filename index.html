    <!-- 所有第三方資源都在本地（assets/vendor）。
         CDN 掛掉時，離線 PWA 也會失去數學排版 —— 那時使用者看到的是滿頁的
         原始 LaTeX，比整站打不開更難理解發生什麼事。
         lucide 只收錄本站用到的 40 個圖示（9KB，官方 UMD 是 1MB）。
         KaTeX 字型只留 woff2（現代瀏覽器全支援）。 -->
