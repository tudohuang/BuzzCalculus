<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuzzCalculus</title>
    <meta name="theme-color" content="#f5f3ed" />
    <meta name="description" content="BuzzCalculus is a calculus reflex trainer for fast practice, weak-point review, and proof drills." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <!-- 所有第三方資源都在本地（assets/vendor）。
         CDN 掛掉時，離線 PWA 也會失去數學排版 —— 那時使用者看到的是滿頁的
         原始 LaTeX，比整站打不開更難理解發生什麼事。
         lucide 只收錄本站用到的 40 個圖示（9KB，官方 UMD 是 1MB）。
         KaTeX 字型只留 woff2（現代瀏覽器全支援）。 -->
    <link rel="stylesheet" href="assets/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="assets/vendor/katex/katex.min.js"></script>
    <script defer src="assets/vendor/icons.js"></script>
    <script defer src="assets/vendor/anime.min.js"></script>
    <script defer src="src/problems.js"></script>
    <script defer src="src/problem_extensions.js"></script>
    <script defer src="src/problem_extensions_2.js"></script>
    <script defer src="src/problem_integrals_hard.js"></script>

    <script defer src="src/problem_todai_burst_pack.js"></script>
    <script defer src="src/problem_world_universities.js"></script>
    <script defer src="src/problem_competition_pack.js"></script>
    <script defer src="src/problem_vector_calculus_pack.js"></script>
    <script defer src="src/problem_core_expansion_pack.js"></script>
    <script defer src="src/problem_applied_graph_pack.js"></script>
    <script defer src="src/problem_damo_pack.js"></script>
    <script defer src="src/problem_set_interval_pack.js"></script>

    <script defer src="src/problem_graph_choice_pack.js"></script>
    <script defer src="src/problem_curve_worksheet_pack.js"></script>
    <script defer src="src/problem_derivative_depth_pack.js"></script>
    <script defer src="src/problem_chain_depth_pack.js"></script>
    <script defer src="src/problem_limit_beyond_taylor_pack.js"></script>
    <script defer src="src/problem_ode_pack.js"></script>
    <!-- 補提示的側表：必須排在所有題庫檔之後，它是往回填 window.BUZZ_PROBLEMS -->
    <!-- canned_hints 必須在 authored_hints 之前：側表用它判斷哪些題實際上看不到提示 -->
    <script defer src="src/kernel/tex_lite.js"></script>
    <script defer src="src/kernel/ink_read.js"></script>
    <script defer src="src/kernel/canned_hints.js"></script>
    <script defer src="src/problem_authored_hints.js"></script>
    <script defer src="src/problem_generated_pack.js"></script>
    <script defer src="src/problem_foundations_pack.js"></script>
    <!-- 難度側表要在校準之前載入：校準會用 rubric 決定 rank。 -->
    <script defer src="src/kernel/skill_tags.js"></script>
    <script defer src="src/kernel/skill_graph.js"></script>
    <script defer src="src/kernel/uid_map.js"></script>
    <script defer src="src/kernel/origin.js"></script>

    <script defer src="src/custom_problems.js"></script>
    <script defer src="src/proofs.js"></script>

    <script defer src="src/kernel/ability.js"></script>
    <script defer src="src/kernel/planner.js"></script>
    <script defer src="src/kernel/session.js"></script>
    <script>
      window.BUZZ_GA_MEASUREMENT_ID = "G-95ST898KT1";
