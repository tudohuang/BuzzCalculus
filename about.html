      <h1>關於 BuzzCalculus</h1>
      <p class="legal-updated">最後更新：2026-09-18</p>

      <p class="legal-lead">看到題目，要想三分鐘才知道用哪個工具。這個網站練的就是那三分鐘。</p>

      <h2>誰做的</h2>
      <p>Tudo Huang（tudohuang）一個人做的。沒有伺服器、沒有帳號。</p>

      <h2>題目</h2>
      <p>
        <strong data-claim="problems">2,403 題</strong>，原創或改寫，依技巧分類。
        標「某某考試風格」的題目是仿照出題習慣寫的，不是真題，與任何學校或機構無關。
      </p>

      <h2>答案</h2>
      <p>每一題的答案都經過與解答無關的獨立驗算，沒通過的不進題庫。</p>

      <h2>你的資料</h2>
      <p>全部在你自己的瀏覽器裡，我們拿不到。</p>

      <p>發現題目錯了，用題目右上角的「回報」。</p>
